name: Build TV Launcher APK

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build launcher APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug -PlauncherApplicationId=com.gathin.tvhome.diagnostic

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-launcher-diagnostic-apk
          path: launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
